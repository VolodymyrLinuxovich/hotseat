<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotseat · the interview panel that learns you</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="labels"></div>

    <section id="intro" class="card center">
      <h1>Hotseat</h1>
      <p class="lede">
        Three interviewers. They talk to each other about you, decide who asks next, and remember how you did last time.
      </p>
      <label>
        Your name (the panel remembers you by it)
        <input id="name" placeholder="e.g. Vova" />
      </label>
      <label>
        Role you're interviewing for
        <input id="role" value="Software Engineer Intern" />
      </label>
      <div id="memory" class="memory"></div>
      <button id="startBtn" class="primary">Take the seat</button>
      <p class="hint">Chrome works best. Allow the microphone, or type your answers.</p>
    </section>

    <header id="hud" class="hidden">
      <div class="brand">Hotseat</div>
      <div id="progress"></div>
      <div class="diff">
        Difficulty
        <span id="diffBar"></span>
      </div>
    </header>

    <aside id="ledger" class="hidden">
      <h2>Panel ledger</h2>
      <p class="sub">What the agents decided, and why</p>
      <div id="ledgerList"></div>
    </aside>

    <footer id="dock" class="hidden">
      <div id="caption">
        <span id="captionWho"></span>
        <span id="captionText"></span>
      </div>
      <div class="answer">
        <button id="micBtn" title="Speak your answer">🎙 Speak</button>
        <textarea id="answerBox" rows="2" placeholder="Your answer… (speak or type)"></textarea>
        <button id="sendBtn" class="primary">Answer</button>
      </div>
      <div id="status"></div>
    </footer>

    <section id="ide" class="hidden">
      <div class="idehead">
        <span class="pill" id="langPill">LIVE CODING · Python</span>
        <h2 id="pTitle"></h2>
        <select id="langSel" title="Language">
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
        </select>
      </div>
      <pre id="pDesc"></pre>
      <textarea id="code" spellcheck="false"></textarea>
      <div class="idebar">
        <button id="runBtn">▶ Run tests</button>
        <span id="testSummary"></span>
        <button id="submitCode" class="primary">Submit to panel</button>
      </div>
      <div id="testList"></div>
    </section>

    <section id="verdict" class="card center hidden"></section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
